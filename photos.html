<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YAN——看见世界</title>

<link rel="stylesheet" href="style.css?v=11" />

<style>
/* ================================
   顶部操作区：音乐与房间菜单
================================ */

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.music-page-btn,
.room-menu-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 34px;
  padding: 5px 10px;
  border: 1px solid rgba(226,197,158,.25);
  border-radius: 6px;
  background: rgba(255,255,255,.04);
  color: #e8d8c1;
  font-family: inherit;
  font-size: .85rem;
  cursor: pointer;
  transition: all .2s;
}

.music-page-btn {
  font-family: Georgia,serif;
  font-size: 1.2rem;
  min-width: 36px;
}

.music-page-btn:hover,
.room-menu-btn:hover {
  color: #d49a68;
  background: rgba(201,145,95,.15);
  border-color: rgba(201,145,95,.45);
}

/* 房间菜单 */
.room-switcher {
  position: relative;
}

.room-menu {
  position: absolute;
  top: calc(100% + 9px);
  right: 0;
  z-index: 300;
  min-width: 155px;
  padding: 6px;
  border: 1px solid rgba(207,165,111,.4);
  border-radius: 9px;
  background: rgba(39,27,19,.97);
  box-shadow: 0 10px 28px rgba(0,0,0,.35);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-5px);
  transition: opacity .2s, transform .2s, visibility .2s;
}

.room-menu.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}

.room-menu button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #e8d8c1;
  font-family: inherit;
  font-size: .85rem;
  text-align: left;
  cursor: pointer;
  transition: background .2s, color .2s;
}

.room-menu button:hover {
  background: rgba(201,145,95,.16);
  color: #e6b17e;
}

/* ================================
   随机摄影开场
================================ */

#photo-intro {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  opacity: 1;
  visibility: visible;
  transition: opacity .5s ease, visibility .5s ease;
}

#photo-intro.leaving {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#intro-enter {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  overflow: hidden;
}

#intro-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform .7s ease;
}

#intro-enter:hover #intro-image {
  transform: scale(1.015);
}

.intro-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 55px 20px 32px;
  color: rgba(255,255,255,.9);
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(0,0,0,.58)
  );
  pointer-events: none;
}

#intro-caption-text {
  font-size: .9rem;
  letter-spacing: .06em;
  text-align: center;
}

.intro-hint {
  font-size: .72rem;
  letter-spacing: .12em;
  color: rgba(255,255,255,.65);
}

/* ================================
   开场图：当天日期（新增）
   位置和大小由脚本按图片实际显示区域设置
================================ */

.intro-date {
  position: absolute;
  --u: 400px;               /* 由脚本更新：字号基准 */
  color: rgba(255,255,255,.92);
  line-height: 1;
  pointer-events: none;
  opacity: 0;               /* 脚本定位完成后再淡入，避免跳动 */
  transition: opacity .6s ease;
  text-shadow: 0 1px 10px rgba(0,0,0,.4);
  /* 只在图片顶部加一层很淡的渐变，保证白字清晰 */
  background: linear-gradient(to bottom, rgba(0,0,0,.3), transparent 30%);
}

.intro-date.ready {
  opacity: 1;
}

.intro-date-left {
  position: absolute;
  left: calc(var(--u) * 0.07);
  top: calc(var(--u) * 0.075);
}

.intro-date-ym {
  display: block;
  font-size: calc(var(--u) * 0.052);
  font-weight: 300;
  letter-spacing: .02em;
}

.intro-date-day {
  display: block;
  margin-top: calc(var(--u) * 0.015);
  font-family: "Noto Serif SC", "Songti SC", Georgia, "Times New Roman", serif;
  font-size: calc(var(--u) * 0.19);
  font-weight: 400;
  letter-spacing: -.02em;
}

.intro-date-week {
  position: absolute;
  right: calc(var(--u) * 0.07);
  top: calc(var(--u) * 0.12);
  font-size: calc(var(--u) * 0.038);
  font-weight: 300;
  letter-spacing: .08em;
  opacity: .92;
}

/* 手机端顶部操作区 */
@media(max-width:600px) {
  .top-actions {
    gap: 5px;
  }

  .music-page-btn,
  .room-menu-btn {
    min-height: 32px;
    padding: 4px 7px;
    font-size: .78rem;
  }

  .music-page-btn {
    min-width: 32px;
    font-size: 1.1rem;
  }

  .intro-caption {
    padding-bottom: 26px;
  }

  #intro-caption-text {
    font-size: .82rem;
  }
}

@media(max-width:380px) {
  .room-menu-btn span {
    font-size: .7rem;
  }

  .top-actions {
    gap: 4px;
  }
}
</style>
</head>

<body>

<!-- 随机摄影开场 -->
<div id="photo-intro">
  <button
    id="intro-enter"
    type="button"
    aria-label="点击进入照片馆"
  >
    <img id="intro-image" src="" alt="" />

    <!-- 新增：当天日期 -->
    <div class="intro-date" id="intro-date">
      <div class="intro-date-left">
        <span class="intro-date-ym" id="intro-date-ym"></span>
        <span class="intro-date-day" id="intro-date-day"></span>
      </div>
      <span class="intro-date-week" id="intro-date-week"></span>
    </div>

    <div class="intro-caption">
      <span id="intro-caption-text"></span>
      <span class="intro-hint">点击照片，进入照片馆</span>
    </div>
  </button>
</div>

<!-- 顶部导航 -->
<div id="top-bar">

  <span id="brand-name">YAN——看见世界</span>

  <div class="top-actions">

    <!-- 音乐按钮 -->
    <button
      id="music-btn"
      class="music-page-btn"
      type="button"
      aria-label="打开音乐播放器"
      title="音乐播放器"
    >♫</button>

    <!-- 选择房间 -->
    <div class="room-switcher">

      <button
        id="room-menu-btn"
        class="room-menu-btn"
        type="button"
        aria-expanded="false"
        aria-label="房间"
      >
        <span>房间</span>⌄
      </button>

      <div id="room-menu" class="room-menu">
        <button type="button" data-page="home.html">
          卧室
        </button>

        <button type="button" data-page="writing.html">
          书房
        </button>
      </div>

    </div>

  </div>
</div>

<!-- 顶部分类导航 -->
<div id="category-bar">
  <nav id="nav"></nav>
</div>

<!-- 原有照片时间轴 -->
<main id="gallery"></main>

<!-- 原有图片灯箱 -->
<div id="lightbox" class="hidden">

  <button id="close" aria-label="关闭图片">✕</button>

  <button id="prev" aria-label="上一张">‹</button>

  <img id="lightbox-img" src="" alt="" />

  <button id="next" aria-label="下一张">›</button>

</div>

<!-- 加载原有照片数据和照片馆功能 -->
<script src="script.js?v=9"></script>

<script>
/* ================================
   音乐播放器入口
================================ */

document.getElementById("music-btn").addEventListener("click", () => {

  window.parent.postMessage({
    type: "open-player"
  }, "*");

});

/* ================================
   房间菜单
================================ */

const roomMenuBtn = document.getElementById("room-menu-btn");
const roomMenu = document.getElementById("room-menu");

roomMenuBtn.addEventListener("click", (e) => {

  e.stopPropagation();

  const isOpen = roomMenu.classList.toggle("open");

  roomMenuBtn.setAttribute(
    "aria-expanded",
    isOpen ? "true" : "false"
  );

});

/* 点击菜单项目切换页面 */
roomMenu.querySelectorAll("button[data-page]").forEach(button => {

  button.addEventListener("click", () => {

    const page = button.dataset.page;

    roomMenu.classList.remove("open");

    roomMenuBtn.setAttribute("aria-expanded", "false");

    window.parent.postMessage({
      type: "navigate",
      page: page
    }, "*");

  });

});

/* 点击其他区域关闭菜单 */
document.addEventListener("click", (e) => {

  if (
    !roomMenu.contains(e.target) &&
    !roomMenuBtn.contains(e.target)
  ) {

    roomMenu.classList.remove("open");

    roomMenuBtn.setAttribute("aria-expanded", "false");

  }

});

/* ================================
   随机摄影开场
================================ */

const intro = document.getElementById("photo-intro");
const introImage = document.getElementById("intro-image");
const introCaption = document.getElementById("intro-caption-text");
const introEnter = document.getElementById("intro-enter");

/* 直接读取 script.js 中原有的 photos 数组 */
if (typeof photos !== "undefined" && photos.length > 0) {

  const randomIndex = Math.floor(Math.random() * photos.length);
  const randomPhoto = photos[randomIndex];

  introImage.src = randomPhoto.src;
  introImage.alt = randomPhoto.caption;
  introCaption.textContent = randomPhoto.caption;

} else {

  /* 如果照片数据未加载，不阻挡原页面 */
  intro.remove();

}

/* 点击随机照片，淡出并进入原有照片馆 */
introEnter.addEventListener("click", () => {

  intro.classList.add("leaving");

  setTimeout(() => {
    intro.remove();
  }, 500);

});

/* ================================
   开场图：当天日期（新增）
================================ */

(function () {

  const dateBox = document.getElementById("intro-date");
  if (!dateBox || !document.body.contains(intro)) return;

  /* 1. 填入今天的日期 */
  const now = new Date();
  const weekNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

  document.getElementById("intro-date-ym").textContent =
    now.getFullYear() + "/" + String(now.getMonth() + 1).padStart(2, "0");
  document.getElementById("intro-date-day").textContent = now.getDate();
  document.getElementById("intro-date-week").textContent = weekNames[now.getDay()];

  /* 2. 把日期层对齐到图片「实际显示」的区域（避开 contain 产生的黑边） */
  function layoutDate() {

    const nw = introImage.naturalWidth;
    const nh = introImage.naturalHeight;
    if (!nw || !nh) return;

    const cw = introEnter.clientWidth;
    const ch = introEnter.clientHeight;

    const scale = Math.min(cw / nw, ch / nh);
    const w = nw * scale;
    const h = nh * scale;

    dateBox.style.left = (cw - w) / 2 + "px";
    dateBox.style.top = (ch - h) / 2 + "px";
    dateBox.style.width = w + "px";
    dateBox.style.height = h + "px";

    /* 字号基准：横图时不会因为太宽而显得过大 */
    dateBox.style.setProperty("--u", Math.min(w, h * 0.62) + "px");

    dateBox.classList.add("ready");
  }

  if (introImage.complete) {
    layoutDate();
  }
  introImage.addEventListener("load", layoutDate);
  window.addEventListener("resize", layoutDate);

})();

</script>

</body>
</html>

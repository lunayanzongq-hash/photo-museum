
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YAN</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #0b0705;
}

body {
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
  color: #f1e2c4;
}

#backdrop {
  position: fixed;
  inset: -80px;
  width: calc(100% + 160px);
  height: calc(100% + 160px);
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
  filter: blur(36px) brightness(.62) saturate(1.1);
  transition: filter .8s ease;
}

body.off #backdrop {
  filter: blur(36px) brightness(.14) saturate(.8);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(
    ellipse 85% 90% at 50% 52%,
    transparent 58%,
    rgba(8,4,2,.42) 100%
  );
}

#stage {
  position: fixed;
  inset: 0;
  z-index: 1;
  transition: transform 1s cubic-bezier(.65,0,.35,1);
}

#room {
  width: 100%;
  height: 100%;
  display: block;
}

#fade {
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  opacity: 0;
  transition: opacity .5s ease .45s;
}

#fade.show {
  opacity: 1;
}

h1 {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: 22px;
  z-index: 5;
  font-weight: 400;
  letter-spacing: .32em;
  font-size: clamp(.9rem,1.6vw,1.15rem);
  color: #f1e2c4;
  text-shadow: 0 1px 8px rgba(0,0,0,.85);
  pointer-events: none;
}

#hint {
  position: fixed;
  bottom: max(14px,env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  z-index: 5;
  text-align: center;
  font-size: .78rem;
  letter-spacing: .2em;
  opacity: .75;
  text-shadow: 0 1px 6px rgba(0,0,0,.9);
  pointer-events: none;
  transition: opacity 1.2s ease;
}

#hint.gone {
  opacity: 0;
}

.dim, .dim-lamp {
  opacity: 0;
  transition: opacity .8s ease;
  pointer-events: none;
}

body.off .dim {
  opacity: 1;
}

body.off .dim-lamp {
  opacity: .85;
}

/* 吊灯 */

#lamp {
  cursor: pointer;
  outline: none;
}

.ring {
  fill: none;
  stroke: #ffd596;
  stroke-width: 2;
  opacity: 0;
  transition: opacity .25s;
}

#lamp:hover .ring,
#lamp:focus-visible .ring {
  opacity: .95;
}

#lamp.hint .ring,
body.off #lamp .ring {
  animation: pulse 2.4s ease-in-out infinite;
}

body.off #lamp .lamp-tip {
  opacity: .75;
}

@keyframes pulse {
  0%,100% { opacity: 0; }
  50% { opacity: .85; }
}

.lamp-tip {
  font-size: 17px;
  letter-spacing: 4px;
  fill: #fff1d4;
  opacity: 0;
  transition: opacity .25s;
  paint-order: stroke;
  stroke: rgba(0,0,0,.85);
  stroke-width: 4px;
  pointer-events: none;
}

#lamp:hover .lamp-tip,
#lamp:focus-visible .lamp-tip {
  opacity: 1;
}

/* 笔记本 */

.nb {
  cursor: pointer;
  outline: none;
}

.nb .lift {
  transition: transform .3s cubic-bezier(.2,.8,.3,1),
              filter .3s ease;
}

.nb:hover .lift,
.nb:focus-visible .lift {
  transform: translateY(-9px);
  filter: drop-shadow(0 12px 9px rgba(0,0,0,.55)) brightness(1.06);
}

body.off .nb:hover .lift,
body.off .nb:focus-visible .lift {
  filter: drop-shadow(0 12px 9px rgba(0,0,0,.6)) brightness(1.7);
}

/* 复古木质收音机 */

#radio {
  cursor: pointer;
  outline: none;
}

#radio .radio-body {
  transform-box: fill-box;
  transform-origin: center;
  transition: filter .3s ease, transform .3s ease;
}

#radio:hover .radio-body,
#radio:focus-visible .radio-body {
  transform: translateY(-5px);
  filter: brightness(1.07) drop-shadow(0 12px 9px rgba(0,0,0,.4));
}

#radio.playing .radio-light {
  opacity: 1;
  animation: radioGlow 2.4s ease-in-out infinite;
}

#radio.playing .radio-indicator {
  fill: #ffd27e;
  filter: url(#radioGlowFilter);
}

#radio.playing .radio-meter {
  animation: meterMove 2s ease-in-out infinite alternate;
}

@keyframes radioGlow {
  0%,100% { opacity: .55; }
  50% { opacity: 1; }
}

@keyframes meterMove {
  from { transform: translateX(0); }
  to { transform: translateX(20px); }
}

@media (prefers-reduced-motion:reduce) {
  #stage,#fade,.dim,.dim-lamp,#backdrop,
  .nb .lift,#radio .radio-body {
    transition: none !important;
  }

  #lamp.hint .ring,
  body.off #lamp .ring,
  #radio.playing .radio-light,
  #radio.playing .radio-meter {
    animation: none;
  }
}
</style>
</head>

<script>
(function () {

  var room = document.getElementById('room');
  var stage = document.getElementById('stage');
  var fade = document.getElementById('fade');
  var lamp = document.getElementById('lamp');
  var lampTip = document.getElementById('lampTip');
  var hintEl = document.getElementById('hint');

  var reduce = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  /* 提示文字 */

  function hideHint() {
    clearTimeout(hintTimer);
    hintEl.classList.add('gone');
  }

  var hintTimer = setTimeout(hideHint,7000);
  window.addEventListener('click',hideHint);

  /* 固定取景 */

  function panMode() {
    return window.matchMedia(
      '(hover: hover) and (pointer: fine)'
    ).matches && window.innerWidth / window.innerHeight >= 1.2;
  }

  function fit() {

    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var a = vw / vh;

    var vb;
    var par = 'xMidYMid slice';

    if (panMode()) {

      var w = 1448 + 2 * 90;
      var h = w / a;

      if (h > 1606) {
        h = 1606;
        w = h * a;
      }

      var x = 560 + 724 - w / 2;
      var fixedY = 260 + (1086 - h) * .5;

      vb = x + ' ' + fixedY + ' ' + w + ' ' + h;

    } else {

      if (a < 1) {
        vb = '650 0 1270 1606';
        par = 'xMidYMid meet';

      } else if (a < 1.33) {
        vb = '560 260 1448 1086';
        par = 'xMidYMid meet';

      } else if (a > 2.4) {
        vb = '0 260 2568 1086';
        par = 'xMidYMid meet';

      } else {
        vb = '0 260 2568 1086';
      }
    }

    room.setAttribute('viewBox',vb);
    room.setAttribute('preserveAspectRatio',par);
  }

  window.addEventListener('resize',fit);
  fit();

  /* 开关灯 */

  function toggleLamp() {

    var off = document.body.classList.toggle('off');

    lamp.setAttribute('aria-pressed',off ? 'false' : 'true');
    lampTip.textContent = off ? '开灯' : '关灯';
    lamp.classList.remove('hint');
  }

  lamp.addEventListener('click',toggleLamp);

  lamp.addEventListener('keydown',function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleLamp();
    }
  });

  /* 笔记本页面转场 */

  document.querySelectorAll('a.nb').forEach(function(a) {

    a.addEventListener('click',function(e) {

      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) {
        return;
      }

      e.preventDefault();

      var href = a.getAttribute('href');

      /* 减少动态效果时直接切换 */

      if (reduce) {
        window.parent.postMessage({
          type: 'navigate',
          page: href
        }, '*');

        return;
      }

      var r = a.querySelector('.hit').getBoundingClientRect();

      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;

      var vw = window.innerWidth;
      var vh = window.innerHeight;

      var s = Math.min(
        vw * .9 / r.width,
        vh * .9 / r.height,
        5
      );

      stage.style.transformOrigin = cx + 'px ' + cy + 'px';

      stage.style.transform =
        'translate(' +
        (vw / 2 - cx) + 'px,' +
        (vh / 2 - cy) + 'px) scale(' + s + ')';

      fade.style.background = a.getAttribute('data-fade') || '#000';
      fade.classList.add('show');

      setTimeout(function() {

        window.parent.postMessage({
          type: 'navigate',
          page: href
        }, '*');

      },1000);

    });
  });

  /* 收音机：通知外层播放器打开 */

  var radio = document.getElementById('radio');

  function openPlayer() {

    window.parent.postMessage({
      type: 'open-player'
    }, '*');

  }

  radio.addEventListener('click',openPlayer);

  radio.addEventListener('keydown',function(e) {

    if (e.key === 'Enter' || e.key === ' ') {

      e.preventDefault();
      openPlayer();

    }

  });

  /* 返回主页时重置场景 */

  window.addEventListener('pageshow',function() {

    stage.style.transform = '';
    fade.classList.remove('show');

    document.body.classList.remove('off');

    lamp.setAttribute('aria-pressed','true');
    lampTip.textContent = '关灯';
    lamp.classList.add('hint');

    fit();

  });

})();
</script>

</body>
</html>

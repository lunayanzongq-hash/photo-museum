<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YAN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      min-height: 100vh;

      background-image: url('photos/bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      color: rgba(255,255,255,0.92);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: rgba(0,0,0,0.25);
    }

    #main-wrap {
      display: flex;
      position: relative;
      z-index: 2;
    }

    /* ===== sidebar ===== */
    #sidebar {
      width: 60px;
      background: rgba(0,0,0,0.35);
      height: 100vh;
      position: sticky;
      top: 0;
      transition: 0.3s;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      gap: 18px;
    }

    #sidebar.open {
      width: 220px;
    }

    /* 🚪 门图标按钮 */
    .door-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.6rem;
      cursor: pointer;

      background: rgba(255,255,255,0.08);
      border-radius: 10px;

      transition: 0.2s;
      user-select: none;
    }

    .door-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.05);
    }

    /* ===== content ===== */
    #content {
      flex: 1;
      padding: 40px;
      max-width: 720px;
      margin: 20px;
      border-radius: 12px;

      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
    }

    /* ===== 文章项 ===== */
    .article-block {
      padding: 14px 12px;
      margin-bottom: 16px;
      border-radius: 8px;

      transition: all 0.4s ease;

      opacity: 0.35;
      transform: scale(0.98);
      filter: blur(1px);
    }

    .article-block.active {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 30px rgba(255,255,255,0.08);
    }

    .article-block h2 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #fff;
    }

    .article-block .body {
      font-size: 0.95rem;
      line-height: 2;
      color: rgba(255,255,255,0.9);
      white-space: pre-wrap;
    }

    .article-block .date {
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

<div id="main-wrap">

  <!-- 🚪 左门：进入文章页 -->
  <aside id="sidebar">
    <div class="door-btn" onclick="location.href='text.html'">🚪</div>

    <!-- 🚪 右门：返回首页 -->
    <div class="door-btn" onclick="location.href='index.html'">🚪</div>
  </aside>

  <main id="content">
    <div id="article-container"></div>
  </main>

</div>

<script src="articles.js"></script>

<script>
  const container = document.getElementById("article-container");

  articles.forEach((a) => {
    const div = document.createElement("div");
    div.className = "article-block";

    div.innerHTML = `
      <div class="date">${a.date}</div>
      <h2>${a.title}</h2>
      <div class="body">${a.content}</div>
    `;

    container.appendChild(div);
  });

  const blocks = document.querySelectorAll(".article-block");

  function updateActiveBlock() {
    let closestIndex = 0;
    let minDistance = Infinity;

    blocks.forEach((block, i) => {
      const rect = block.getBoundingClientRect();
      const distance = Math.abs(rect.top - window.innerHeight / 2);

      if (distance < minDistance) {
        minDistance = distance;
        closestIndex = i;
      }
    });

    blocks.forEach(b => b.classList.remove("active"));
    if (blocks[closestIndex]) {
      blocks[closestIndex].classList.add("active");
    }
  }

  window.addEventListener("scroll", updateActiveBlock);
  window.addEventListener("load", updateActiveBlock);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YAN的文字博物馆</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      display: flex; flex-direction: column; 
      background-image: url('photos/bg.jpg'); 
      background-size: cover; background-position: center; background-attachment: fixed; 
      color: #222; font-family: sans-serif; min-height: 100vh; 
      transition: background 0.6s ease;
    }
    body.reading {
      background-image: none;
      background-color: #f5ecd4;
    }

    .font-btns { display: none; gap: 6px; margin-left: auto; }
    body.reading .font-btns { display: flex; }

    #top-bar { position: sticky; top: 0; z-index: 150; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: rgba(20,20,20,0.7); border-bottom: 1px solid rgba(255,255,255,0.08); transition: background 0.6s ease; }
    body.reading #top-bar { background: rgba(160,140,90,0.5); }
    #toggle-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #e0dcd4; flex-shrink: 0; }
    #toggle-btn:hover { color: #c9773f; }
    #brand-name { font-size: 0.95rem; color: #e0dcd4; letter-spacing: 0.08em; white-space: nowrap; }
    .font-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: #e0dcd4; cursor: pointer; border-radius: 4px; width: 28px; height: 24px; font-size: 0.75rem; line-height: 1; }
    .font-btn:hover { background: rgba(201,119,63,0.2); color: #c9773f; }

    #main-wrap { display: flex; flex: 1; }

    #sidebar { width: 0; min-width: 0; background: rgba(20,20,20,0.7); padding: 0; display: flex; flex-direction: column; align-items: stretch; gap: 12px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow: hidden; transition: width .3s ease, padding .3s ease, background 0.6s ease; border-right: 1px solid rgba(255,255,255,0.08); }
    #sidebar.open { width: 220px; min-width: 220px; padding: 20px 16px; overflow-y: auto; }
    body.reading #sidebar { background: rgba(160,140,90,0.5); }

    #back-btn { font-size: 0.8rem; color: #e0dcd4; text-decoration: none; }
    #back-btn:hover { color: #c9773f; }

    #article-nav { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .nav-item { font-size: 0.85rem; color: #ccc; cursor: pointer; padding: 6px 8px; border-radius: 4px; line-height: 1.4; white-space: nowrap; }
    .nav-item:hover { background: rgba(201,119,63,0.2); color: #c9773f; }
    .nav-item.active { background: rgba(201,119,63,0.25); color: #c9773f; }

    #content { 
      flex: 1; 
      padding: 48px; 
      margin: 24px auto; 
      border-radius: 12px; 
      max-width: 760px; 
      width: 100%;
      background: linear-gradient(180deg, rgba(255,253,248,0.95) 0%, rgba(255,253,248,0.85) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      position: relative;
      transition: background 0.6s ease;
    }
    body.reading #content {
      background: rgba(250,240,210,0.4);
      box-shadow: none;
      border: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #list { display: flex; flex-direction: column; gap: 28px; font-size: 15px; }
    .item { border-bottom: 1px solid #e8e0d0; padding-bottom: 24px; cursor: pointer; }
    .item:hover h2 { color: #000; }
    .item .date { color: #aaa; margin-bottom: 6px; }
    .item h2 { margin-bottom: 8px; color: #333; transition: color .2s; }
    .item .summary { color: #888; line-height: 1.7; }
    #article { display: none; }
    #article .back-btn { color: #8a7a52; cursor: pointer; margin-bottom: 32px; display: inline-block; }
    #article .back-btn:hover { color: #6a5c3d; }
    #article-header { text-align: center; margin-bottom: 40px; padding-bottom: 28px; border-bottom: 1px solid rgba(160,140,90,0.3); }
    #article h2 { font-size: 1.6rem; color: #3d3728; font-weight: 600; margin-bottom: 12px; }
    #article .date { color: #a89c7d; }
    #article .body { color: #4a4438; line-height: 2.1; white-space: pre-wrap; text-indent: 2em; }

    #back-top { position: fixed; bottom: 36px; right: 36px; width: 42px; height: 42px; background: rgba(20,20,20,0.7); border: 1px solid rgba(255,255,255,0.15); border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; color: #e0dcd4; box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: background .2s, color .2s; z-index: 99; }
    #back-top:hover { background: rgba(201,119,63,0.3); color: #c9773f; }
    #back-top.visible { display: flex; }

    @media (max-width: 768px) {
      #sidebar { position: fixed; top: 53px; left: 0; height: calc(100vh - 53px); z-index: 140; }
      #sidebar.open { width: 60%; min-width: unset; }
      #content { padding: 20px; margin: 10px auto; }
      #back-top { bottom: 20px; right: 20px; }
      #main-wrap { position: relative; }
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <button id="toggle-btn" onclick="toggleSidebar(event)">☰</button>
    <span id="brand-name">YAN——理解世界</span>
    <div class="font-btns">
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
      <button class="font-btn" onclick="changeFontSize(-1)">A-</button>
    </div>
  </div>
  <div id="main-wrap">
    <aside id="sidebar">
      <a id="back-btn" href="index.html">← 返回主页</a>
      <nav id="article-nav"></nav>
    </aside>
    <main id="content">
      <div id="list"></div>
      <div id="article">
        <span class="back-btn" onclick="showList()">← 返回列表</span>
        <div id="article-header">
          <h2 id="art-title"></h2>
          <div class="date" id="art-date"></div>
        </div>
        <div class="body" id="art-body"></div>
      </div>
    </main>
  </div>
  <div id="back-top" onclick="scrollToTop()">↑</div>
  <script src="articles.js"></script>
  <script>
    const list = document.getElementById("list");
    const articleView = document.getElementById("article");
    const articleNav = document.getElementById("article-nav");
    const sidebar = document.getElementById("sidebar");
    const artBody = document.getElementById("art-body");
    const content = document.getElementById("content");
    const backTop = document.getElementById("back-top");
    const brandName = document.getElementById("brand-name");
    let fontSize = 18;
    content.style.fontSize = fontSize + "px";

    window.addEventListener("scroll", () => {
      backTop.classList.toggle("visible", window.scrollY > 300);
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleSidebar(e) {
      if (e) e.stopPropagation();
      sidebar.classList.toggle("open");
    }

    document.addEventListener("click", (e) => {
      if (sidebar.classList.contains("open") && !sidebar.contains(e.target)) {
        sidebar.classList.remove("open");
      }
    });

    function changeFontSize(delta) {
      fontSize = Math.min(Math.max(fontSize + delta, 12), 24);
      content.style.fontSize = fontSize + "px";
    }

    function showList() {
      list.style.display = "flex";
      articleView.style.display = "none";
      document.body.classList.remove("reading");
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
    }

    function showArticle(i) {
      list.style.display = "none";
      articleView.style.display = "block";
      document.body.classList.add("reading");
      document.getElementById("art-title").textContent = articles[i].title;
      document.getElementById("art-date").textContent = articles[i].date;
     artBody.innerHTML = articles[i].content;
      window.scrollTo({ top: 0, behavior: "smooth" });
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      articleNav.children[i].classList.add("active");
    }

    articles.forEach((a, i) => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = "<div class='date'>" + a.date + "</div><h2>" + a.title + "</h2><div class='summary'>" + a.summary + "</div>";
      div.onclick = () => showArticle(i);
      list.appendChild(div);

      const btn = document.createElement("div");
      btn.className = "nav-item";
      btn.textContent = a.title;
      btn.onclick = () => showArticle(i);
      articleNav.appendChild(btn);
    });
  </script>
</body>
</html>

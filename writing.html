<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>文字</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; background: #111; color: #eee; font-family: sans-serif; height: 100vh; }
    #sidebar { width: 200px; min-width: 200px; background: #1a1a1a; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
    #sidebar h1 { font-size: 1rem; color: #888; letter-spacing: 0.1em; }
    #sidebar a.back { color: #666; text-decoration: none; font-size: 0.85rem; }
    #sidebar a.back:hover { color: #aaa; }
    #list { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; gap: 32px; max-width: 680px; }
    .article { border-bottom: 1px solid #222; padding-bottom: 28px; cursor: pointer; }
    .article h2 { font-size: 1.1rem; margin-bottom: 8px; }
    .article p { color: #888; font-size: 0.9rem; line-height: 1.7; }
    .article .date { color: #555; font-size: 0.8rem; margin-bottom: 6px; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h1>✍️ 文字</h1>
    <a class="back" href="home.html">← 返回</a>
  </aside>
  <main id="list">
    <div class="article">
      <div class="date">2024-06-01</div>
      <h2>第一篇文章标题</h2>
      <p>这里是文章的摘要或者正文，可以写一段话。把这里替换成你自己写的内容。</p>
    </div>
    <div class="article">
      <div class="date">2024-05-20</div>
      <h2>第二篇文章标题</h2>
      <p>另一篇文章的摘要，同样替换成你自己的文字。</p>
    </div>
  </main>
</body>
</html>

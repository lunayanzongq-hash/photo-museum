<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background-image: url('photos/bg.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-attachment: fixed;
      color: #eee; 
      font-family: sans-serif; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 16px; 
      position: relative;
      padding: 20px;
      text-align: center;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }
    h1 { 
      position: relative;
      z-index: 1;
      font-size: 1.4rem; 
      color: #eee; 
      margin-bottom: 24px; 
      line-height: 1.6;
      max-width: 500px;
      font-weight: 500;
    }
    .cards { 
      position: relative;
      z-index: 1;
      display: flex; 
      gap: 24px; 
      flex-wrap: wrap;
      justify-content: center;
    }
    .card { 
      width: 160px; 
      height: 200px; 
      background: rgba(26,26,26,0.6); 
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 16px; 
      cursor: pointer; 
      text-decoration: none; 
      color: #eee; 
      transition: background .2s, transform .2s; 
    }
    .card:hover { 
      background: rgba(37,37,37,0.8); 
      transform: translateY(-4px); 
    }
    .card .icon { font-size: 2.5rem; }
    .card .label { font-size: 1rem; color: #ddd; }

    .growth-card{
      background: linear-gradient(135deg, #12293f, #08141f);
      border: 1px solid #3d5a70;
    }
    .growth-card .icon{
      color: #e8b95c;
    }
    .growth-card .label{
      color: #9fb3c2;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.1rem; max-width: 90%; }
      .cards { gap: 16px; }
      .card { width: 130px; height: 170px; }
      .card .icon { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <h1>YAN的精神家园</h1>
  <div class="cards">
    <a class="card" href="photos.html">
      <div class="icon">📷</div>
      <div class="label">影像</div>
    </a>
    <a class="card" href="writing.html">
      <div class="icon">✍️</div>
      <div class="label">文字</div>
    </a>
    <a class="card growth-card" href="growth.html">
      <div class="icon">🌳</div>
      <div class="label">生长</div>
    </a>
  </div>
</body>
</html>
